# Optional Production-Style TLS 1.3 Reverse-Proxy Overlay for AegisOps
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
# Terminates HTTPS on :8443 using Caddy internal TLS CA so Tier 1 Collector -> Tier 2 SaaS
# traverses encrypted HTTPS rather than loopback HTTP.

services:
  tls-gateway:
    image: caddy:2-alpine
    container_name: aegisops-tls-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./scripts/bootstrap/Caddyfile.tls:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ingest-boundary

  collector:
    environment:
      COLLECTOR_SAAS_INGEST_URL: https://tls-gateway:8443/api/v1/ingest/telemetry
      COLLECTOR_SAAS_HEARTBEAT_URL: https://tls-gateway:8443/api/v1/ingest/heartbeat
      # Set false ONLY when using Caddy's local self-signed internal CA; true with trusted certs
      COLLECTOR_TLS_VERIFY: ${COLLECTOR_TLS_VERIFY:-false}
    depends_on:
      tls-gateway:
        condition: service_started
