[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisops-collector"
version = "0.1.0"
description = "AegisOps Tier 1 Local Collector — Observe everything. Expose nothing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "psutil>=6.0.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
